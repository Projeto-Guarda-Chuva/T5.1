name: QA - Equipe T5.1 (Web)

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

jobs:
  testes:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do repositório
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Instalar dependências do Backend
        run: |
          cd backend

          python -m venv .venv
          .venv/bin/python -m pip install --upgrade pip

          if [ -f requirements.txt ]; then
            .venv/bin/pip install -r requirements.txt
          fi

          if [ -f requirements-dev.txt ]; then
            .venv/bin/pip install -r requirements-dev.txt
          fi

      - name: Executar testes do Backend
        run: |
          cd backend
          .venv/bin/pytest -q

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Instalar dependências e testar Admin Parametrização
        run: |
          cd frontend/admin-parametrizacao
          npm install
          npm run test

      - name: Instalar dependências e testar Meus Vídeos
        run: |
          cd frontend/meus-videos
          npm install
          npm run test
