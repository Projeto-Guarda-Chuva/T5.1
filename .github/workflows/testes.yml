name: QA - Equipe T5.1 (Web)

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

jobs:
  backend:
    name: Backend
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Instalar dependências
        run: |
          cd backend

          python -m venv .venv
          .venv/bin/python -m pip install --upgrade pip

          if [ -f requirements.txt ]; then
            .venv/bin/pip install -r requirements.txt
          fi

          if [ -f requirements-dev.txt ]; then
            .venv/bin/pip install -r requirements-dev.txt
          fi

      - name: Executar testes
        run: |
          cd backend
          .venv/bin/pytest -q

  admin-parametrizacao:
    name: Frontend - Admin Parametrização
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Instalar dependências
        run: |
          cd frontend/admin-parametrizacao
          npm install

      - name: Executar testes
        run: |
          cd frontend/admin-parametrizacao
          npm run test

  meus-videos:
    name: Frontend - Meus Vídeos
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Instalar dependências
        run: |
          cd frontend/meus-videos
          npm install

      - name: Executar testes
        run: |
          cd frontend/meus-videos
          npm run test
